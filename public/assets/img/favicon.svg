<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8ff55"/>
      <stop offset="100%" stop-color="#9ad61b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#d8ff55" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Container -->
  <rect width="64" height="64" rx="18" fill="#0d1017"/>
  <rect x="1" y="1" width="62" height="62" rx="17" fill="none" stroke="rgba(216, 255, 85, 0.2)" stroke-width="1.5"/>
  <!-- Stylized "S" / Cashflow Curve -->
  <path d="M 41 23 C 41 18 36.5 16 32 16 C 26 16 22 19 22 24 C 22 33 42 29 42 39 C 42 45 37 48 32 48 C 26 48 21.5 45 21 39"
