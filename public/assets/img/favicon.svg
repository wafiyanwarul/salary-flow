        stroke-linejoin="round"
        filter="url(#shadow)"/>
  <!-- Accent Dots for Cashflow Flow -->
  <circle cx="43" cy="20" r="2.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="21" cy="42" r="2.5" fill="#d8ff55"/>
